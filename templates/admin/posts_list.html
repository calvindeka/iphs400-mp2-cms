{% extends "admin/_base.html" %}
{% block admin_content %}
  <h1>Posts</h1>
  <p><a href="/admin/posts/new">New post</a></p>
  <table>
    <tr><th>Title</th><th>Category</th><th>Status</th><th>Slug</th><th></th></tr>
    {% for p in posts %}
    <tr>
      <td>{{ p.title }}</td>
      <td>{{ p.category }}</td>
      <td>{{ p.status }}</td>
      <td>{{ p.slug }}</td>
      <td>
        <a href="/admin/posts/{{ p.id }}/edit">Edit</a>
        <form method="post" action="/admin/posts/{{ p.id }}/delete" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
